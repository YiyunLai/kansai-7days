<title>關西七日帖</title>
<script src="config.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a stamp-rally notebook. Route-map of Kansai (Kyoto → Osaka → Kobe) on the left, the day's timetable on the right;
   stops collect vermilion 朱印 stamps. Indigo-dyed (藍) ink on pale stone paper; night indigo in dark mode. */
:root{
  --paper:#eef0ec; --card:#fafaf7; --ink:#1c2230; --ink-2:#5d6473; --rule:#cfd3cc;
  --ai:#24426f; --shu:#c8402a; --land:#e3e6df; --mount:#d5dbd0; --sea:#d9e2ea; --water:#9db6cf;
  --f-serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12161f; --card:#1a1f2b; --ink:#e8e6df; --ink-2:#9aa1b0; --rule:#2c3341;
  --ai:#93acd9; --shu:#ec6a50; --land:#1a202c; --mount:#1f2a2a; --sea:#151d2c; --water:#3c5a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161f; --card:#1a1f2b; --ink:#e8e6df; --ink-2:#9aa1b0; --rule:#2c3341;
  --ai:#93acd9; --shu:#ec6a50; --land:#1a202c; --mount:#1f2a2a; --sea:#151d2c; --water:#3c5a80; color-scheme:dark}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-sans);font-size:15px;line-height:1.7;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--shu);outline-offset:3px}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-serif);font-weight:900;font-size:20px;letter-spacing:.12em;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--shu);display:inline-block}
.count{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);display:flex;gap:16px}
.count b{color:var(--ink);font-weight:500;font-size:15px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:1px solid transparent;padding:4px 10px;font-size:14px;border-radius:2px}
.nav button:hover{border-color:var(--rule)}
.nav button[aria-pressed="true"]{color:var(--shu)}

/* ---------- main layout ---------- */
.main{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:40px;padding-top:28px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr);gap:28px}}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px}
.gwrap{position:relative;border:1px solid var(--ink);background:var(--land)}
.gmap{width:100%;height:min(72vh,680px);min-height:420px}
.gmap iframe{border:0;width:100%;height:100%;display:block}
.gnote{position:absolute;left:10px;bottom:10px;right:10px;background:var(--card);border:1px solid var(--rule);padding:8px 12px;font-size:13px;color:var(--ink-2)}
.pin{position:relative;display:grid;justify-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;transform:translateY(6px)}
.pin .ph{width:46px;height:46px;border-radius:50%;border:3px solid #1c2230;background:#e3e6df center/cover no-repeat;box-shadow:0 2px 6px rgb(0 0 0 / .35);
  display:grid;place-items:center;font-family:var(--f-serif);font-weight:900;font-size:15px;color:#1c2230;filter:grayscale(1) contrast(.9);transition:transform .15s}
.pin:hover .ph{transform:scale(1.12)}
.pin.found .ph{border-color:#c8402a;filter:none}
.pin.unknown .ph{border:3px dashed #c8402a;filter:none;background-color:#fafaf7}
.pin .lb{font-size:12px;font-weight:700;color:#1c2230;background:#fafaf7;border:1px solid #1c2230;padding:0 6px;line-height:1.5;white-space:nowrap}
.pin:not(.found):not(.unknown) .lb{display:none}
.pin .ck{position:absolute;top:-4px;right:-6px;width:18px;height:18px;border-radius:50%;background:#c8402a;color:#fff;font-size:11px;display:none;place-items:center;border:2px solid #fafaf7}
.pin.found .ck{display:grid}
.strip{display:flex;gap:12px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:thin}
.strip .pin{transform:none;flex:none;width:76px}
.strip .pin .ph{width:58px;height:58px}
.strip .pin .lb{display:block;border:0;background:none;font-weight:500;color:var(--ink);white-space:normal;text-align:center;font-size:12px;line-height:1.3}
.strip .pin:not(.found) .lb{color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-2);margin:12px 0 0;display:flex;gap:6px 18px;flex-wrap:wrap}
.hint span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1.2px solid var(--ink);background:var(--card)}

/* ---------- timetable ---------- */
.side h2{font-family:var(--f-serif);font-weight:900;font-size:clamp(26px,4vw,34px);line-height:1.25;margin:0;letter-spacing:.06em;text-wrap:balance}
.side .sum{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);margin:6px 0 18px;display:flex;gap:4px 16px;flex-wrap:wrap}
.days{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--ink);margin-bottom:22px}
.days button{background:none;border:0;border-left:1px solid var(--ink);padding:8px 0 6px;display:grid;justify-items:center;line-height:1.2;position:relative;min-width:0}
.days button:first-child{border-left:0}
.days button b{font-family:var(--f-serif);font-size:18px;font-weight:700}
.days button span{font-family:var(--f-mono);font-size:10px;color:var(--ink-2)}
.days button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.days button[aria-selected="true"] span{color:var(--paper);opacity:.75}
.days button.done::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--shu)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:6px}
.dayhead h3{font-family:var(--f-serif);font-size:20px;margin:0;font-weight:700}
.dayhead span{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.tt{list-style:none;margin:0;padding:0}
.tt li{display:grid;grid-template-columns:48px 22px minmax(0,1fr);gap:0 10px;align-items:start}
.tt .t{font-family:var(--f-mono);font-size:13px;padding-top:9px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tt .rail{position:relative;align-self:stretch}
.tt .rail::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--ink)}
.tt li:first-child .rail::before{top:16px}
.tt li:last-child .rail::before{bottom:calc(100% - 18px)}
.tt .stopr .rail::after{content:"";position:absolute;left:4px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}
.tt .stopr.found .rail::after{background:var(--shu);border-color:var(--shu)}
.tt .stopr button{background:none;border:0;padding:6px 0 8px;text-align:left;width:100%;min-width:0;display:block}
.tt .stopr button:hover .nm{color:var(--shu)}
.tt .nm{font-weight:700;font-size:15px;display:block;line-height:1.45}
.tt .st{font-size:12px;color:var(--ink-2)}
.tt .note{display:block;font-family:var(--f-mono);font-size:12px;color:var(--ai)}
.tt .mv{font-size:12px;color:var(--ink-2)}
.tt .mv .t{padding-top:1px;font-size:11px}
.tt .mv > span:last-child{padding:1px 0 3px}
.tt .mv > .leg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:3px 0 5px;min-width:0}
.leg .to{color:var(--ink);font-size:12px}
.leg .plan{font-family:var(--f-mono);font-size:11px}
.go{display:inline-flex;flex-wrap:wrap;gap:4px}
.go a{font-size:12px;line-height:1.2;padding:3px 9px;border:1px solid var(--rule);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--card);white-space:nowrap}
.go a::after{content:" ↗";color:var(--ink-2)}
.go a:hover{border-color:var(--ink)}
.go a.pri{border-color:var(--ai);color:var(--ai)}
.nextleg{margin-top:14px;padding:12px 14px;border:1px solid var(--rule);display:grid;gap:8px}
.nextleg b{font-size:14px}
.nextleg small{font-size:12px;color:var(--ink-2)}
.empty{border:1px dashed var(--ink-2);padding:18px;color:var(--ink-2);font-size:14px}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;z-index:50;background:rgb(16 20 30 / .45);display:flex;align-items:center;justify-content:center;
  padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:560px;max-height:100%;overflow:auto;background:var(--card);border:1px solid var(--ink);padding:24px;position:relative}
.sheet.wide{max-width:720px}
.x{position:absolute;top:10px;right:10px;width:34px;height:34px;border:0;background:var(--card);border-radius:50%;z-index:2;font-size:22px;line-height:1;color:var(--ink-2)}
.x:hover{color:var(--ink)}
.hero{margin:-24px -24px 18px;position:relative}
.hero img{display:block;width:100%;height:220px;object-fit:cover}
.hero figcaption{position:absolute;right:8px;bottom:6px;font-size:11px;background:rgb(0 0 0 / .55);color:#fff;padding:1px 6px}
.hero figcaption a{color:#fff}
.sheet a{color:var(--ai)}
.spothead{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:16px;align-items:start;padding-right:20px}
.sheet h2{font-family:var(--f-serif);font-weight:900;font-size:clamp(22px,5vw,28px);line-height:1.3;margin:4px 0;text-wrap:balance}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin:0;letter-spacing:.04em}
.meta .n{color:var(--shu)}
.addr{font-size:13px;color:var(--ink-2);margin:4px 0 0}
.flight{font-family:var(--f-mono);font-size:13px;color:var(--ai);margin:8px 0 0}
.mame{margin:18px 0 0;padding:14px 16px;background:var(--paper)}
.mame b{display:block;font-family:var(--f-serif);font-size:13px;letter-spacing:.2em;color:var(--shu);margin-bottom:2px}
.mame p{margin:0}
.visits{font-size:13px;color:var(--ink-2);margin:12px 0 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;align-items:center}
.btn{border:1px solid var(--ink);background:none;padding:7px 16px;font-size:14px;line-height:1.3;border-radius:2px}
.btn:hover{background:var(--ink);color:var(--card)}
.btn.shu{background:var(--shu);border-color:var(--shu);color:#fff}
.btn.shu:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.3;pointer-events:none}
.sp{flex:1}

/* stamp */
.stamp{width:96px;height:96px;color:var(--shu);transform:rotate(-6deg)}
.stamp.new{animation:press .5s cubic-bezier(.2,1.6,.4,1) both}
.stamp.off{color:var(--rule)}
@keyframes press{0%{transform:scale(1.6) rotate(-16deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}

/* stamp book */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px 10px;margin-top:16px}
.book button{background:none;border:0;padding:0;display:grid;justify-items:center;gap:2px;min-width:0}
.book .stamp{width:76px;height:76px}
.book small{font-size:12px;color:var(--ink-2);text-align:center;line-height:1.3}
.bar{height:4px;background:var(--rule);margin-top:10px}
.bar span{display:block;height:100%;background:var(--shu)}

/* games */
.glist{display:grid;margin-top:12px;border-top:1px solid var(--rule)}
.glist .g{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.glist .k{font-family:var(--f-serif);font-weight:900;font-size:28px;color:var(--shu);text-align:center}
.glist h4{margin:0;font-family:var(--f-serif);font-size:17px}
.glist p{margin:0;font-size:13px;color:var(--ink-2)}
.glist .hs{font-family:var(--f-mono);font-size:12px;color:var(--ai)}
.ghud{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:13px;margin-top:12px}
.gcv{display:block;width:100%;max-width:340px;aspect-ratio:3/4;margin:8px auto 0;border:1px solid var(--ink);touch-action:none}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:10px auto 0}
.mem button{aspect-ratio:1;border:1px solid var(--ink);background:var(--card);display:grid;place-content:center;gap:4px;padding:4px;min-width:0;border-radius:2px}
.mem button b{font-family:var(--f-serif);font-weight:900;font-size:clamp(26px,8vw,36px);line-height:1}
.mem button span{font-size:12px;color:var(--ink-2)}
.mem button.ok{background:var(--ai);border-color:var(--ai);color:var(--card)}
.mem button.ok span{color:var(--card)}
.mem button.bad{background:var(--shu);border-color:var(--shu);color:#fff}
.mem button.bad span{color:#fff}
.order{max-width:340px;margin:10px auto 0;padding:10px 12px;background:var(--paper);font-size:14px;min-height:48px;text-align:center}
.order b{font-family:var(--f-serif)}
.res{margin-top:12px}

/* ---------- cover ---------- */
.cover{position:fixed;inset:0;z-index:70;background:var(--paper);display:grid;place-items:center;overflow:hidden;
  padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.cover .wave{position:absolute;left:0;right:0;bottom:0;height:30%;width:100%}
.cover .in{position:relative;display:flex;gap:clamp(24px,6vw,64px);align-items:stretch;flex-direction:row-reverse}
.cover h1{display:flex;flex-direction:column;gap:.12em;flex:none;align-self:center;font-family:var(--f-serif);font-weight:900;font-size:clamp(44px,11vw,104px);margin:0;line-height:1;color:var(--ink)}
.cover h1 em{font-style:normal;color:var(--shu)}
.cover .info{display:flex;flex-direction:column;justify-content:flex-end;gap:14px;max-width:15em}
.cover .info p{margin:0;font-size:14px;color:var(--ink-2)}
.cover .info .d{font-family:var(--f-mono);font-size:13px;letter-spacing:.12em;color:var(--ink)}
.cover .info .c{font-family:var(--f-serif);font-size:20px;color:var(--ink);letter-spacing:.3em}
.cover .seal{width:60px;height:60px;color:var(--shu);transform:rotate(-8deg)}

/* ---------- toast & ending ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--paper);
  padding:10px 18px;font-size:14px;max-width:calc(100% - 32px);text-align:center;border-radius:2px}
.ending{position:fixed;inset:0;z-index:75;background:#14182a;color:#ebe8df;overflow:hidden}
.ending .roll{position:absolute;top:14%;right:0;display:flex;flex-direction:row-reverse;align-items:flex-start;gap:1.1em;font-family:var(--f-serif);font-size:clamp(16px,2.4vw,20px);will-change:transform}
.ending .col{display:flex;flex-direction:column;align-items:center;line-height:1.25;flex:none}
.ending .col.h{font-size:1.45em;font-weight:900;color:#f07a5f;margin-left:.4em}
.ending .col.d{color:#8f97ab;font-family:var(--f-mono);font-size:13px}
.ending .gap{width:2.4em;flex:none}
.ending .ctl{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));display:flex;gap:6px;z-index:2}
.ending .ctl button{background:#14182a;border:1px solid #4a5168;color:#ebe8df;padding:4px 12px;font-size:13px;border-radius:2px}
@media (prefers-reduced-motion:reduce){.stamp.new{animation:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="sgh" width="16" height="8" patternUnits="userSpaceOnUse">
      <g fill="var(--sea)" stroke="var(--water)" stroke-width=".55">
        <circle cx="0" cy="4" r="7.5"/><circle cx="0" cy="4" r="5"/><circle cx="0" cy="4" r="2.5"/>
        <circle cx="16" cy="4" r="7.5"/><circle cx="16" cy="4" r="5"/><circle cx="16" cy="4" r="2.5"/>
        <circle cx="8" cy="8" r="7.5"/><circle cx="8" cy="8" r="5"/><circle cx="8" cy="8" r="2.5"/>
      </g>
    </pattern>
  </defs>
</svg>

<div class="cover" id="cover">
  <svg class="wave" preserveAspectRatio="none" aria-hidden="true"><rect width="100%" height="100%" fill="url(#sgh)"/></svg>
  <div class="in">
    <h1 aria-label="關西七日帖"><span>關</span><span>西</span><em>七</em><span>日</span><span>帖</span></h1>
    <div class="info">
      <svg class="seal" viewBox="0 0 64 64" aria-hidden="true"><rect x="3" y="3" width="58" height="58" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><text x="32" y="29" text-anchor="middle" font-family="Noto Serif TC,serif" font-weight="900" font-size="18" fill="currentColor">集</text><text x="32" y="51" text-anchor="middle" font-family="Noto Serif TC,serif" font-weight="900" font-size="18" fill="currentColor">印</text></svg>
      <p class="c">神戶・京都・大阪</p>
      <p class="d">2027.2.20 — 2.26</p>
      <p>沿著行程走一遍，每到一站蓋一枚朱印。集滿 22 枚，翻到最後一頁。</p>
      <div><button class="btn shu" id="startBtn">開始集印</button></div>
    </div>
  </div>
</div>

<header class="top"><div class="in">
  <div class="brand"><i></i>關西七日帖</div>
  <div class="count"><span>朱印 <b id="cFound">0</b>/<span id="cTotal">22</span></span><span>日 <b id="cDays">0</b>/7</span></div>
  <nav class="nav">
    <button id="bBook">印章帳</button><button id="bGames">小遊戲</button><button id="bEnd">終章</button><button id="bSound" aria-pressed="false">音</button>
  </nav>
</div></header>

<main class="main">
  <section>
    <p class="eyebrow">Google Maps · 地圖</p>
    <div class="gwrap"><div class="gmap" id="gmap"></div></div>
    <div class="strip" id="strip" aria-label="這一天的景點"></div>
    <div class="hint">
      <span><i class="dot" style="background:#9aa"></i>未到訪（黑白）</span>
      <span><i class="dot" style="background:var(--shu);border-color:var(--shu)"></i>已蓋印</span>
      <span><i class="dot" style="border-style:dashed;border-color:var(--shu)"></i>待安排</span>
      <span>照片：維基百科／Wikimedia Commons</span>
    </div>
  </section>
  <aside class="side">
    <p class="eyebrow">Timetable · 行程表</p>
    <h2>神戶・京都・大阪<br>七日之旅</h2>
    <p class="sum"><span>31 停留點</span><span>3,602.4 km</span><span>STARLUX JX1834 / JX1835</span></p>
    <div class="days" role="tablist" id="days"></div>
    <div id="dayview"></div>
  </aside>
</main>

<div class="veil" id="veil" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="ending" id="ending" hidden>
  <div class="ctl"><button id="enPause">暫停</button><button id="enReplay">重播</button><button id="enClose">關閉</button></div>
  <div class="roll" id="roll"></div>
</div>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);

/* ================= SOUND (soft chimes) ================= */
let ac = null;
function tone(f = 660, d = .25, v = .06) {
  if (!state.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const chime = () => [880, 1175, 1568].forEach((f, i) => setTimeout(() => tone(f, .6, .05), i * 110));

/* ================= STAMP ================= */
function stampSVG(id, cls = "") {
  const s = SPOTS[id], v = STOPS.find(x => x.spot === id);
  const chars = [...(s.seal || "印")];
  const fs = chars.length <= 1 ? 30 : chars.length === 2 ? 22 : 16;
  const step = fs * 1.05, y0 = 47 - (chars.length - 1) * step / 2 + fs * .36;
  return `<svg class="stamp ${cls}" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="1"/>
    ${chars.map((c, i) => `<text x="50" y="${y0 + i * step}" text-anchor="middle" font-family="Noto Serif TC,serif" font-weight="900" font-size="${fs}" fill="currentColor">${esc(c)}</text>`).join("")}
    <text x="50" y="84" text-anchor="middle" font-family="DM Mono,monospace" font-size="6.5" fill="currentColor" letter-spacing="1">2027.${v ? v.day.date.replace("/", ".") : ""}</text>
  </svg>`;
}

async function loadPhotos() {
  if (Object.keys(PHOTO).length >= Object.keys(GEO).length - 1) return;
  const titles = [...new Set(Object.values(SPOTS).flatMap(s => s.wiki || []))];
  const url = "https://ja.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail%7Cname&pithumbsize=480&titles=" + encodeURIComponent(titles.join("|"));
  try {
    const j = await (await fetch(url)).json(), q = j.query || {};
    const alias = {}; (q.normalized || []).concat(q.redirects || []).forEach(r => alias[r.from] = r.to);
    const res = t => { let k = t, n = 0; while (alias[k] && n++ < 4) k = alias[k]; return k; };
    const byTitle = {}; Object.values(q.pages || {}).forEach(p => { if (p.thumbnail) byTitle[p.title] = { src: p.thumbnail.source, file: p.pageimage, title: p.title }; });
    Object.entries(SPOTS).forEach(([id, s]) => { for (const t of s.wiki || []) { const hit = byTitle[res(t)]; if (hit) { PHOTO[id] = hit; break; } } });
    try { localStorage.setItem(PKEY, JSON.stringify({ t: Date.now(), p: PHOTO })); } catch (e) {}
  } catch (e) { console.warn("photo load failed", e); }
  refreshPins();
}

  function newRound() {

    if (round >= sizes.length) { $("#mem").innerHTML = ""; $("#order").textContent = "採買完成"; return endGame("C", score); }
    const pool = shuffle(FOODS.slice()); list = pool.slice(0, sizes[round]); picked = 0; phase = "show";
    $("#gT").textContent = `第 ${round + 1} / 5 回`;
    $("#order").innerHTML = "清單　" + list.map(f => `<b>${f[1]}</b>`).join("・");
    $("#mem").innerHTML = shuffle(pool.slice(0, 9)).map(f => `<button disabled data-f="${f[1]}"><b>${f[0]}</b><span>${f[1]}</span></button>`).join("");
    tm = setTimeout(() => { if (!alive) return; phase = "pick"; $("#order").textContent = `清單收起來了，挑出 ${list.length} 樣`; veil.querySelectorAll("#mem button").forEach(b => b.disabled = false); }, 1500 + sizes[round] * 650);
  }
  $("#mem").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || phase !== "pick" || b.disabled) return;
    b.disabled = true;
    if (list.some(f => f[1] === b.dataset.f)) {
      b.classList.add("ok"); score += 10; picked++; tone(1046, .2, .04);
      if (picked === list.length) { score += 20; phase = "done"; $("#order").textContent = "全部買齊　+20"; round++; tm = setTimeout(newRound, 900); }
    } else { b.classList.add("bad"); tone(196, .3, .06); phase = "done"; $("#order").textContent = "買錯了。清單是：" + list.map(f => f[1]).join("・"); round++; tm = setTimeout(newRound, 1700); }
    $("#gS").textContent = "得分 " + score;
  });
  newRound();
}

let anim = null;
function openEnding() {
  close();
  const en = $("#ending"), roll = $("#roll");
  const col = (cls, str) => `<div class="col ${cls}">${[...str].map(ch => ch === " " ? "<span>&nbsp;</span>" : `<span>${esc(/[—\-]/.test(ch) ? "｜" : ch)}</span>`).join("")}</div>`;
  roll.innerHTML = ROLL.map(([t, s]) => t === "g" ? `<div class="gap"></div>` : col(t === "h" ? "h" : t === "d" ? "d" : "", s)).join("");
  en.hidden = false;
  const vw = innerWidth, w = roll.offsetWidth, from = -vw, to = Math.max(0, w - vw + 48);
  anim?.cancel();
  anim = roll.animate([{ transform: `translateX(${from}px)` }, { transform: `translateX(${to}px)` }], { duration: reduced ? 1 : Math.max(24000, (to - from) * 22), fill: "forwards", easing: "linear" });
  $("#enPause").textContent = "暫停"; $("#enClose").focus();
  if (state.sound) chime();
}
function closeEnding() { anim?.cancel(); $("#ending").hidden = true; $("#bEnd").focus(); }
